<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Математика ЦТ 2026</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #f0f2f5;
            --primary-color: #007aff;
            --success-color: #34c759;
            --error-color: #ff3b30;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px 15px 80px 15px; /* Отступ под таббар */
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        /* Таббар как на скрине image_1e16f7.png */
        .tab-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 65px;
            background: white;
            border-top: 1px solid #e5e5ea;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-item.active { color: var(--primary-color); }
        .tab-icon { font-size: 24px; margin-bottom: 4px; }

        /* Экраны */
        .screen { display: none; }
        .screen.active { display: block; }

        /* Стили меню и тестов */
        .topic-card {
            background: #f1f1f7;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
        }

        .resume-banner {
            background: #e7f3ff;
            border: 1px solid var(--primary-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .stat-item {
            background: #fff;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .progress-bar-bg { background: #e5e5ea; height: 8px; border-radius: 4px; margin-top: 8px; }
        .progress-bar-fill { background: var(--success-color); height: 100%; border-radius: 4px; transition: 0.5s; }

        .image-container img { width: 100%; border-radius: 12px; margin-bottom: 15px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .opt-btn { background: #f1f1f7; padding: 12px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; }
        .opt-btn.selected { border-color: var(--primary-color); background: #e7f3ff; }
        
        input[type="text"] { width: 100%; padding: 15px; border: 2px solid #d1d1d6; border-radius: 12px; margin-bottom: 15px; box-sizing: border-box; }
        .main-btn { width: 100%; padding: 16px; background: var(--primary-color); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
        
        .correct-bg { background-color: var(--success-color) !important; }
        .wrong-bg { background-color: var(--error-color) !important; }
        .solution-box { display: none; margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 15px; }
    </style>
</head>
<body>

<div class="content-area">
    <!-- ТЕСТЫ / ГЛАВНАЯ -->
    <div id="screen-tests" class="screen active">
        <div id="resume-container" class="resume-banner">
            <p style="margin: 0 0 10px 0; font-size: 14px;">У тебя есть незаконченный тест!</p>
            <button class="main-btn" style="padding: 10px;" onclick="resumeTest()">Продолжить тему "<span id="resume-topic"></span>"</button>
        </div>
        <h2>Темы для подготовки</h2>
        <div id="topic-list"></div>
    </div>

    <!-- ТЕСТ (ИНТЕРФЕЙС) -->
    <div id="screen-quiz" class="screen">
        <div class="header" style="display:flex; justify-content: space-between; margin-bottom:15px; color:#8e8e93;">
            <span id="q-topic-title">Тема</span>
            <span id="q-progress">0 / 0</span>
        </div>
        <div class="image-container"><img id="q-img" src=""></div>
        <div id="options-container" class="options-grid"></div>
        <input type="text" id="user-answer" placeholder="Ответ">
        <div id="wrong-hint" style="color:var(--error-color); text-align:center; display:none; margin-bottom:10px; font-weight:bold;"></div>
        <button class="main-btn" id="submit-btn" onclick="handleCheck()">Ответить</button>
        <div id="solution-section" class="solution-box">
            <div class="image-container"><img id="s-img" src=""></div>
            <button class="main-btn" style="background:var(--success-color);" id="next-btn" onclick="handleNext()">Далее</button>
        </div>
    </div>

    <!-- СТАТИСТИКА -->
    <div id="screen-stats" class="screen">
        <h2>Твой прогресс</h2>
        <div id="stats-container"></div>
    </div>
</div>

<!-- ТАББАР (image_1e16f7.png) -->
<nav class="tab-bar">
    <button class="tab-item active" onclick="switchTab('tests', this)">
        <span class="tab-icon">📚</span>
        <span>Тесты</span>
    </button>
    <button class="tab-item" onclick="switchTab('stats', this)">
        <span class="tab-icon">📊</span>
        <span>Статистика</span>
    </button>
</nav>

<script>
    const database = {
        "Тригонометрия": [
            { question: "https://placehold.co/600x400?text=Trig+Q1", solution: "https://placehold.co/600x400?text=Trig+Sol", options: ["0", "1", "0.5", "-1"], answer: "0.5" },
            { question: "https://placehold.co/600x400?text=Trig+Q2", solution: "https://placehold.co/600x400?text=Trig+Sol", answer: "180" }
        ],
        "Планиметрия": [
            { question: "https://placehold.co/600x400?text=Geom+Q1", solution: "https://placehold.co/600x400?text=Geom+Sol", answer: "25" }
        ]
    };

    let currentTest = null;
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Переключение вкладок
    function switchTab(screenId, btn) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById('screen-' + screenId).classList.add('active');
        btn.classList.add('active');
        if(screenId === 'stats') renderStats();
        if(screenId === 'tests') checkResume();
    }

    // Проверка сохраненного прогресса
    function checkResume() {
        const saved = localStorage.getItem('active_test');
        const container = document.getElementById('resume-container');
        if (saved) {
            const data = JSON.parse(saved);
            document.getElementById('resume-topic').innerText = data.topic;
            container.style.display = 'block';
        } else {
            container.style.display = 'none';
        }
    }

    function renderTopics() {
        const list = document.getElementById('topic-list');
        list.innerHTML = '';
        Object.keys(database).forEach(topic => {
            const div = document.createElement('div');
            div.className = 'topic-card';
            div.innerHTML = `${topic} <span>→</span>`;
            div.onclick = () => startNewTest(topic);
            list.appendChild(div);
        });
    }

    function startNewTest(topic) {
        currentTest = {
            topic: topic,
            tasks: database[topic],
            idx: 0,
            correct: 0
        };
        saveProgress();
        openQuiz();
    }

    function resumeTest() {
        currentTest = JSON.parse(localStorage.getItem('active_test'));
        openQuiz();
    }

    function saveProgress() {
        localStorage.setItem('active_test', JSON.stringify(currentTest));
    }

    function openQuiz() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-quiz').classList.add('active');
        renderTask();
    }

    function renderTask() {
        const task = currentTest.tasks[currentTest.idx];
        document.getElementById('q-topic-title').innerText = currentTest.topic;
        document.getElementById('q-progress').innerText = `${currentTest.idx + 1} / ${currentTest.tasks.length}`;
        document.getElementById('q-img').src = task.question;
        document.getElementById('s-img').src = task.solution;
        document.getElementById('solution-section').style.display = 'none';
        document.getElementById('wrong-hint').style.display = 'none';
        
        const btn = document.getElementById('submit-btn');
        btn.disabled = false;
        btn.classList.remove('correct-bg', 'wrong-bg');
        btn.innerText = "Ответить";

        const optContainer = document.getElementById('options-container');
        const inputField = document.getElementById('user-answer');
        
        if (task.options) {
            inputField.style.display = 'none';
            optContainer.style.display = 'grid';
            optContainer.innerHTML = '';
            task.options.forEach(opt => {
                const b = document.createElement('button');
                b.className = 'opt-btn';
                b.innerText = opt;
                b.onclick = () => { selectedOption = opt; document.querySelectorAll('.opt-btn').forEach(el => el.classList.remove('selected')); b.classList.add('selected'); };
                optContainer.appendChild(b);
            });
        } else {
            optContainer.style.display = 'none';
            inputField.style.display = 'block';
            inputField.value = '';
            inputField.disabled = false;
        }
    }

    function handleCheck() {
        const task = currentTest.tasks[currentTest.idx];
        const userVal = task.options ? selectedOption : document.getElementById('user-answer').value.trim();
        if (!userVal) return;

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;

        if (userVal == task.answer) {
            currentTest.correct++;
            btn.classList.add('correct-bg');
            btn.innerText = "Верно!";
            tg.HapticFeedback.notificationOccurred('success');
        } else {
            btn.classList.add('wrong-bg');
            btn.innerText = "Ошибка";
            document.getElementById('wrong-hint').innerText = `Ответ: ${task.answer}`;
            document.getElementById('wrong-hint').style.display = 'block';
            tg.HapticFeedback.notificationOccurred('error');
        }
        document.getElementById('solution-section').style.display = 'block';
    }

    function handleNext() {
        currentTest.idx++;
        if (currentTest.idx < currentTest.tasks.length) {
            saveProgress();
            renderTask();
        } else {
            finishTest();
        }
    }

    function finishTest() {
        // Сохраняем в общую статистику
        const stats = JSON.parse(localStorage.getItem('stats') || '{}');
        const topic = currentTest.topic;
        if (!stats[topic]) stats[topic] = { solved: 0, total: 0 };
        stats[topic].solved += currentTest.correct;
        stats[topic].total += currentTest.tasks.length;
        localStorage.setItem('stats', JSON.stringify(stats));

        localStorage.removeItem('active_test');
        alert(`Тест завершен! Результат: ${currentTest.correct} из ${currentTest.tasks.length}`);
        switchTab('tests', document.querySelector('.tab-item'));
    }

    function renderStats() {
        const container = document.getElementById('stats-container');
        const stats = JSON.parse(localStorage.getItem('stats') || '{}');
        container.innerHTML = Object.keys(database).map(topic => {
            const data = stats[topic] || { solved: 0, total: 0 };
            const percent = data.total > 0 ? Math.round((data.solved / data.total) * 100) : 0;
            return `
                <div class="stat-item">
                    <div style="display:flex; justify-content:space-between">
                        <strong>${topic}</strong>
                        <span>${percent}%</span>
                    </div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${percent}%"></div></div>
                    <div style="font-size:12px; color:#8e8e93; margin-top:5px">Верно: ${data.solved} из ${data.total}</div>
                </div>
            `;
        }).join('');
    }

    window.onload = () => { renderTopics(); checkResume(); };
</script>
</body>
</html>
